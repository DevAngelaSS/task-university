<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Task University</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Task University</h1>
    <nav>
        <a th:href="@{/tareas}">Tareas</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/dashboard}">Dashboard</a>
    </nav>
</header>
<main>
    <div class="tarjeta">
        <h2>Registrar usuario</h2>
        <form th:action="@{/usuarios}" th:object="${usuario}" method="post">
            <div>
                <input type="text" th:field="*{nombre}" placeholder="Nombre completo">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>
            <div>
                <input type="email" th:field="*{correo}" placeholder="Correo electronico">
                <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
            </div>
            <button type="submit">Guardar usuario</button>
        </form>
    </div>

    <div class="tarjeta">
        <h2>Listado de usuarios</h2>
        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.correo}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
