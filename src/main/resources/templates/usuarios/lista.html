<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Task University</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-graduation-cap me-2"></i>Task University
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tareas}"><i class="fa-solid fa-list-check me-1"></i> Tareas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" th:href="@{/usuarios}"><i class="fa-solid fa-users me-1"></i> Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="row g-4">
            
            <!-- Tarjeta: Registrar Usuario -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="card-title mb-0 fw-bold text-primary">
                            <i class="fa-solid fa-user-plus me-2"></i>Registrar Usuario
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/usuarios}" th:object="${usuario}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Juan Pérez">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" class="form-control" th:field="*{correo}" placeholder="ejemplo@correo.com">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Usuario
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tarjeta: Listado de Usuarios -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold text-dark">
                            <i class="fa-solid fa-users-gear me-2 text-primary"></i>Listado de Usuarios
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Nombre</th>
                                        <th>Correo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${usuarios}">
                                        <td class="ps-4 fw-semibold text-dark">
                                            <i class="fa-solid fa-circle-user me-2 text-secondary"></i>
                                            <span th:text="${u.nombre}"></span>
                                        </td>
                                        <td class="text-muted" th:text="${u.correo}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(usuarios)}">
                                        <td colspan="2" class="text-center py-4 text-muted">
                                            <i class="fa-solid fa-folder-open display-6 d-block mb-2"></i>
                                            No hay usuarios registrados actualmente.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
