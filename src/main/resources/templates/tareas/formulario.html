<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar tarea - Task University</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Task University</h1>
    <nav>
        <a th:href="@{/tareas}">Tareas</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/dashboard}">Dashboard</a>
    </nav>
</header>
<main>
    <div class="tarjeta">
        <h2>Editar tarea</h2>
        <form th:action="@{/tareas/editar/{id}(id=${tarea.id})}" th:object="${tarea}" method="post">
            <div>
                <input type="text" th:field="*{titulo}" placeholder="Titulo de la tarea">
                <span class="error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
            </div>
            <textarea th:field="*{descripcion}" placeholder="Descripcion"></textarea>
            <button type="submit">Actualizar tarea</button>
        </form>
    </div>
</main>
</body>
</html>
